<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12150e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Diário</title>
<style>
:root {
  color-scheme: dark;
  --fundo: #12150e;
  --cartao: #1c2016;
  --borda: #2f3625;
  --musgo: #7c8f4a;
  --musgo-forte: #94a85a;
  --texto: #e9ecdf;
  --fraco: #9aa189;
  --perigo: #c9705f;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--fundo);
  color: var(--texto);
  font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  padding-bottom: calc(76px + env(safe-area-inset-bottom));
}
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
header {
  position: sticky;
  top: 0;
  z-index: 2;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: calc(10px + env(safe-area-inset-top)) 12px 10px;
  background: var(--fundo);
  border-bottom: 1px solid var(--borda);
}
header .centro { flex: 1; text-align: center; }
header h1 { margin: 0; font-size: 20px; }
header input[type=date] {
  background: none;
  border: 0;
  color: var(--fraco);
  font-size: 14px;
  text-align: center;
}
.seta {
  width: 44px;
  height: 44px;
  border: 1px solid var(--borda);
  border-radius: 12px;
  background: var(--cartao);
  font-size: 22px;
}
main { max-width: 640px; margin: 0 auto; padding: 4px 12px 12px; }
.topo-secao { display: flex; align-items: center; justify-content: space-between; margin: 18px 0 8px; }
.topo-secao h2 { margin: 0; font-size: 17px; }
.topo-secao small { color: var(--fraco); font-weight: 400; margin-left: 6px; }
.novo {
  border: 0;
  border-radius: 999px;
  background: var(--musgo);
  color: #10130b;
  font-weight: 700;
  padding: 9px 16px;
}
.item {
  display: flex;
  gap: 12px;
  width: 100%;
  text-align: left;
  background: var(--cartao);
  border: 1px solid var(--borda);
  border-radius: 14px;
  padding: 12px;
  margin-bottom: 8px;
}
.item .hora { color: var(--musgo-forte); font-weight: 700; font-variant-numeric: tabular-nums; min-width: 48px; }
.item .corpo { flex: 1; min-width: 0; }
.item strong { display: block; }
.item .texto { color: var(--fraco); white-space: pre-wrap; overflow-wrap: anywhere; }
.vazio { color: var(--fraco); margin: 4px 2px 0; }
nav {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  display: flex;
  background: var(--cartao);
  border-top: 1px solid var(--borda);
  padding-bottom: env(safe-area-inset-bottom);
}
nav button { flex: 1; background: none; border: 0; padding: 18px 0; color: var(--fraco); font-weight: 600; }
nav button.ativo { color: var(--musgo-forte); box-shadow: inset 0 3px 0 var(--musgo); }
dialog {
  width: min(560px, 94vw);
  border: 1px solid var(--borda);
  border-radius: 18px;
  background: var(--cartao);
  color: var(--texto);
  padding: 18px;
}
dialog::backdrop { background: rgba(0, 0, 0, .65); }
dialog h3 { margin: 0 0 12px; }
label { display: block; color: var(--fraco); font-size: 14px; margin: 12px 0 4px; }
input[type=text], input[type=number], input[type=time], main input[type=date], textarea {
  width: 100%;
  background: var(--fundo);
  border: 1px solid var(--borda);
  border-radius: 12px;
  padding: 12px;
}
textarea { min-height: 110px; resize: vertical; }
input:focus, textarea:focus { outline: 2px solid var(--musgo); outline-offset: 1px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips label { margin: 0; }
.chips input { position: absolute; opacity: 0; }
.chips span { display: block; border: 1px solid var(--borda); border-radius: 999px; padding: 8px 14px; color: var(--texto); }
.chips input:checked + span { background: var(--musgo); border-color: var(--musgo); color: #10130b; font-weight: 700; }
.linha { display: flex; gap: 10px; }
.linha > div { flex: 1; }
.acoes { display: flex; gap: 8px; margin-top: 18px; }
.acoes button { flex: 1; border-radius: 12px; padding: 13px; border: 1px solid var(--borda); background: none; font-weight: 600; }
.acoes .principal { background: var(--musgo); border-color: var(--musgo); color: #10130b; }
.acoes .excluir { flex: 0 0 auto; color: var(--perigo); }
.resumo { background: var(--cartao); border: 1px solid var(--borda); border-radius: 14px; padding: 14px; margin-top: 16px; color: var(--fraco); }
.resumo b { color: var(--texto); }
[hidden] { display: none !important; }
</style>
</head>
<body>

<header id="cabecalho">
  <button class="seta" id="anterior" aria-label="Dia anterior">‹</button>
  <div class="centro">
    <h1 id="tituloDia"></h1>
    <input type="date" id="seletorDia" aria-label="Escolher dia">
  </div>
  <button class="seta" id="proximo" aria-label="Próximo dia">›</button>
</header>

<main id="telaDiario">
  <div class="topo-secao">
    <h2>Alimentação</h2>
    <button class="novo" id="novaRefeicao">+ Anotar</button>
  </div>
  <div id="listaRefeicoes"></div>

  <div class="topo-secao">
    <h2>Treinos<small id="kcalDia"></small></h2>
    <button class="novo" id="novoTreino">+ Treino</button>
  </div>
  <div id="listaTreinos"></div>
</main>

<main id="telaExportar" hidden>
  <div class="topo-secao"><h2>Exportar período</h2></div>
  <div class="linha">
    <div><label for="de">De</label><input type="date" id="de"></div>
    <div><label for="ate">Até</label><input type="date" id="ate"></div>
  </div>
  <div class="resumo" id="resumo"></div>
  <div class="acoes">
    <button id="baixar">Baixar PDF</button>
    <button class="principal" id="compartilhar">Compartilhar PDF</button>
  </div>
</main>

<nav>
  <button id="abaDiario" class="ativo">Diário</button>
  <button id="abaExportar">Exportar</button>
</nav>

<dialog id="dlgRefeicao">
  <form id="formRefeicao">
    <h3>O que você comeu?</h3>
    <div class="chips" id="tipos"></div>
    <label for="rHora">Horário</label>
    <input type="time" id="rHora" required>
    <label for="rTexto">O que comeu</label>
    <textarea id="rTexto" required placeholder="Ex.: 2 ovos mexidos, 1 pão francês, café sem açúcar"></textarea>
    <div class="acoes">
      <button type="button" class="excluir" id="rExcluir">Excluir</button>
      <button type="button" id="rCancelar">Cancelar</button>
      <button class="principal">Salvar</button>
    </div>
  </form>
</dialog>

<dialog id="dlgTreino">
  <form id="formTreino">
    <h3>Treino</h3>
    <label for="tTitulo">O que fez</label>
    <input type="text" id="tTitulo" list="sugestoes" required placeholder="Ex.: Treino de costas, Esteira">
    <datalist id="sugestoes"></datalist>
    <label for="tKcal">Calorias gastas (kcal)</label>
    <input type="number" id="tKcal" min="0" inputmode="numeric" required>
    <div class="linha">
      <div><label for="tHoras">Horas</label><input type="number" id="tHoras" min="0" inputmode="numeric"></div>
      <div><label for="tMinutos">Minutos</label><input type="number" id="tMinutos" min="0" inputmode="numeric"></div>
    </div>
    <div class="acoes">
      <button type="button" class="excluir" id="tExcluir">Excluir</button>
      <button type="button" id="tCancelar">Cancelar</button>
      <button class="principal">Salvar</button>
    </div>
  </form>
</dialog>

<script>
const CHAVE = 'diario-v1';
const REFEICOES = ['Café da manhã', 'Almoço', 'Café da tarde', 'Janta', 'Ceia', 'Lanche'];
const TREINOS = ['Treino de costas', 'Treino de peito', 'Treino de pernas', 'Treino de ombros', 'Treino de braços', 'Esteira', 'Bicicleta'];
const DIAS = ['Domingo', 'Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sábado'];
const $ = id => document.getElementById(id);

let dados = carregar();
let dia = hoje();
let editando = null;

function carregar() {
  try {
    return JSON.parse(localStorage.getItem(CHAVE)) || { refeicoes: [], treinos: [] };
  } catch (e) {
    return { refeicoes: [], treinos: [] };
  }
}

function salvar() {
  localStorage.setItem(CHAVE, JSON.stringify(dados));
}

function iso(d) {
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

function hoje() {
  return iso(new Date());
}

function dataDe(texto) {
  return new Date(texto + 'T12:00:00');
}

function somarDias(texto, n) {
  const d = dataDe(texto);
  d.setDate(d.getDate() + n);
  return iso(d);
}

function br(texto) {
  return texto.split('-').reverse().join('/');
}

function duracao(min) {
  if (min < 60) {
    return min + 'min';
  }
  return Math.floor(min / 60) + 'h' + String(min % 60).padStart(2, '0') + 'min';
}

function el(tag, props, ...filhos) {
  const e = Object.assign(document.createElement(tag), props);
  e.append(...filhos);
  return e;
}

function doDia(lista, data) {
  return lista.filter(x => x.data === data);
}

function render() {
  $('tituloDia').textContent = dia === hoje() ? 'Hoje' : DIAS[dataDe(dia).getDay()];
  $('seletorDia').value = dia;

  const refeicoes = doDia(dados.refeicoes, dia).sort((a, b) => a.hora.localeCompare(b.hora));
  $('listaRefeicoes').replaceChildren(...refeicoes.map(r =>
    el('button', { className: 'item', onclick: () => abrirRefeicao(r) },
      el('span', { className: 'hora' }, r.hora),
      el('span', { className: 'corpo' }, el('strong', {}, r.tipo), el('span', { className: 'texto' }, r.texto)))));
  if (!refeicoes.length) {
    $('listaRefeicoes').append(el('p', { className: 'vazio' }, 'Nada anotado neste dia.'));
  }

  const treinos = doDia(dados.treinos, dia);
  $('listaTreinos').replaceChildren(...treinos.map(t =>
    el('button', { className: 'item', onclick: () => abrirTreino(t) },
      el('span', { className: 'corpo' }, el('strong', {}, t.titulo), el('span', { className: 'texto' }, t.kcal + ' kcal · ' + duracao(t.min))))));
  if (!treinos.length) {
    $('listaTreinos').append(el('p', { className: 'vazio' }, 'Nenhum treino neste dia.'));
  }
  $('kcalDia').textContent = treinos.length ? treinos.reduce((s, t) => s + t.kcal, 0) + ' kcal' : '';
}

function tipoPelaHora(hora) {
  const h = Number(hora.slice(0, 2));
  if (h < 10) {
    return 'Café da manhã';
  }
  if (h >= 11 && h < 15) {
    return 'Almoço';
  }
  if (h >= 15 && h < 18) {
    return 'Café da tarde';
  }
  if (h >= 18 && h < 22) {
    return 'Janta';
  }
  if (h >= 22) {
    return 'Ceia';
  }
  return 'Lanche';
}

function abrirRefeicao(r) {
  editando = r ? r.id : null;
  const hora = r ? r.hora : new Date().toTimeString().slice(0, 5);
  $('rHora').value = hora;
  $('rTexto').value = r ? r.texto : '';
  $('formRefeicao').tipo.value = r ? r.tipo : tipoPelaHora(hora);
  $('rExcluir').hidden = !r;
  $('dlgRefeicao').showModal();
}

function abrirTreino(t) {
  editando = t ? t.id : null;
  $('tTitulo').value = t ? t.titulo : '';
  $('tKcal').value = t ? t.kcal : '';
  $('tHoras').value = t ? Math.floor(t.min / 60) || '' : '';
  $('tMinutos').value = t ? t.min % 60 || '' : '';
  $('tExcluir').hidden = !t;
  $('sugestoes').replaceChildren(...[...new Set([...dados.treinos.map(x => x.titulo), ...TREINOS])].map(s => el('option', { value: s })));
  $('dlgTreino').showModal();
}

function gravar(lista, registro, dialogo) {
  const i = lista.findIndex(x => x.id === editando);
  if (i >= 0) {
    lista[i] = { ...lista[i], ...registro };
  } else {
    lista.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), data: dia, ...registro });
  }
  salvar();
  dialogo.close();
  render();
}

function excluir(nome, dialogo) {
  if (!confirm('Excluir este registro?')) {
    return;
  }
  dados[nome] = dados[nome].filter(x => x.id !== editando);
  salvar();
  dialogo.close();
  render();
}

function quebrar(texto, max) {
  const linhas = [];
  let atual = '';
  for (let palavra of texto.split(/\s+/)) {
    while (palavra.length > max) {
      if (atual) {
        linhas.push(atual);
        atual = '';
      }
      linhas.push(palavra.slice(0, max));
      palavra = palavra.slice(max);
    }
    if (atual && (atual + ' ' + palavra).length > max) {
      linhas.push(atual);
      atual = palavra;
    } else {
      atual = atual ? atual + ' ' + palavra : palavra;
    }
  }
  if (atual) {
    linhas.push(atual);
  }
  return linhas;
}

function pdfTexto(s) {
  let r = '';
  for (const c of s.replace(/[“”]/g, '"').replace(/[‘’]/g, "'").replace(/[–—]/g, '-')) {
    const n = c.codePointAt(0);
    if (c === '(' || c === ')' || c === '\\') {
      r += '\\' + c;
    } else if (n >= 32 && n <= 126) {
      r += c;
    } else if (n >= 160 && n <= 255) {
      r += '\\' + n.toString(8);
    } else {
      r += '?';
    }
  }
  return r;
}

function gerarPdf(linhas) {
  const paginas = [[]];
  let y = 800;
  for (const l of linhas) {
    y -= l.s * 1.45;
    if (y < 50) {
      paginas.push([]);
      y = 800 - l.s * 1.45;
    }
    if (l.t) {
      paginas[paginas.length - 1].push(`BT /${l.b ? 'F2' : 'F1'} ${l.s} Tf 1 0 0 1 ${50 + (l.x || 0)} ${y.toFixed(1)} Tm (${pdfTexto(l.t)}) Tj ET`);
    }
  }
  const objetos = [
    '<< /Type /Catalog /Pages 2 0 R >>',
    `<< /Type /Pages /Count ${paginas.length} /Kids [${paginas.map((p, i) => (5 + i * 2) + ' 0 R').join(' ')}] >>`,
    '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>',
    '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>'
  ];
  paginas.forEach((p, i) => {
    const conteudo = p.join('\n');
    objetos.push(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents ${6 + i * 2} 0 R >>`);
    objetos.push(`<< /Length ${conteudo.length} >>\nstream\n${conteudo}\nendstream`);
  });
  let pdf = '%PDF-1.4\n';
  const posicoes = [];
  objetos.forEach((o, i) => {
    posicoes.push(pdf.length);
    pdf += `${i + 1} 0 obj\n${o}\nendobj\n`;
  });
  const xref = pdf.length;
  pdf += `xref\n0 ${objetos.length + 1}\n0000000000 65535 f \n`
    + posicoes.map(p => String(p).padStart(10, '0') + ' 00000 n \n').join('')
    + `trailer\n<< /Size ${objetos.length + 1} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`;
  return new Blob([pdf], { type: 'application/pdf' });
}

function totais(de, ate) {
  const refeicoes = dados.refeicoes.filter(r => r.data >= de && r.data <= ate);
  const treinos = dados.treinos.filter(t => t.data >= de && t.data <= ate);
  return {
    refeicoes: refeicoes.length,
    treinos: treinos.length,
    kcal: treinos.reduce((s, t) => s + t.kcal, 0),
    min: treinos.reduce((s, t) => s + t.min, 0)
  };
}

function linhasRelatorio(de, ate) {
  const linhas = [
    { t: 'Diário alimentar e de treinos', s: 18, b: true },
    { t: 'Período: ' + br(de) + ' a ' + br(ate), s: 11 }
  ];
  const item = texto => quebrar(texto.replace(/\s*\n\s*/g, ' / '), 88).forEach((t, i) => linhas.push({ t, s: 10, x: i ? 22 : 10 }));
  for (let d = de; d <= ate; d = somarDias(d, 1)) {
    const refeicoes = doDia(dados.refeicoes, d).sort((a, b) => a.hora.localeCompare(b.hora));
    const treinos = doDia(dados.treinos, d);
    linhas.push({ t: '', s: 8 }, { t: DIAS[dataDe(d).getDay()] + ', ' + br(d), s: 13, b: true }, { t: 'Alimentação', s: 10, b: true });
    refeicoes.forEach(r => item(r.hora + ' - ' + r.tipo + ': ' + r.texto));
    if (!refeicoes.length) {
      item('Sem registros.');
    }
    linhas.push({ t: 'Treinos', s: 10, b: true });
    treinos.forEach(t => item(t.titulo + ' - ' + t.kcal + ' kcal - ' + duracao(t.min)));
    if (!treinos.length) {
      item('Sem registros.');
    }
    if (treinos.length > 1) {
      item('Total do dia: ' + treinos.reduce((s, t) => s + t.kcal, 0) + ' kcal');
    }
  }
  const t = totais(de, ate);
  linhas.push({ t: '', s: 8 }, { t: 'Resumo do período', s: 13, b: true });
  item('Refeições anotadas: ' + t.refeicoes);
  item('Treinos: ' + t.treinos);
  item('Calorias gastas em treinos: ' + t.kcal + ' kcal');
  item('Tempo total de treino: ' + duracao(t.min));
  return linhas;
}

function atualizarResumo() {
  const de = $('de').value;
  const ate = $('ate').value;
  if (!de || !ate || de > ate) {
    $('resumo').textContent = 'Escolha um período válido.';
    return;
  }
  const t = totais(de, ate);
  $('resumo').replaceChildren(
    el('b', {}, t.refeicoes + ' refeições'), ' e ', el('b', {}, t.treinos + ' treinos'),
    ' no período. Gasto em treinos: ', el('b', {}, t.kcal + ' kcal'), ' em ', el('b', {}, duracao(t.min)), '.');
}

async function exportar(compartilhar) {
  const de = $('de').value;
  const ate = $('ate').value;
  if (!de || !ate || de > ate) {
    return;
  }
  const arquivo = new File([gerarPdf(linhasRelatorio(de, ate))], 'diario_' + de + '_a_' + ate + '.pdf', { type: 'application/pdf' });
  if (compartilhar) {
    try {
      await navigator.share({ files: [arquivo], title: arquivo.name });
    } catch (e) {}
    return;
  }
  el('a', { href: URL.createObjectURL(arquivo), download: arquivo.name }).click();
}

function trocarAba(exportando) {
  $('telaDiario').hidden = exportando;
  $('cabecalho').hidden = exportando;
  $('telaExportar').hidden = !exportando;
  $('abaDiario').classList.toggle('ativo', !exportando);
  $('abaExportar').classList.toggle('ativo', exportando);
  if (exportando) {
    atualizarResumo();
  }
}

$('tipos').append(...REFEICOES.map(t => el('label', {}, el('input', { type: 'radio', name: 'tipo', value: t }), el('span', {}, t))));
$('de').value = somarDias(hoje(), -new Date().getDay());
$('ate').value = hoje();
$('compartilhar').hidden = !(navigator.canShare && navigator.canShare({ files: [new File([''], 'a.pdf', { type: 'application/pdf' })] }));

$('anterior').onclick = () => { dia = somarDias(dia, -1); render(); };
$('proximo').onclick = () => { dia = somarDias(dia, 1); render(); };
$('seletorDia').onchange = e => { dia = e.target.value || hoje(); render(); };
$('novaRefeicao').onclick = () => abrirRefeicao();
$('novoTreino').onclick = () => abrirTreino();
$('rCancelar').onclick = () => $('dlgRefeicao').close();
$('tCancelar').onclick = () => $('dlgTreino').close();
$('rExcluir').onclick = () => excluir('refeicoes', $('dlgRefeicao'));
$('tExcluir').onclick = () => excluir('treinos', $('dlgTreino'));
$('abaDiario').onclick = () => trocarAba(false);
$('abaExportar').onclick = () => trocarAba(true);
$('de').onchange = atualizarResumo;
$('ate').onchange = atualizarResumo;
$('baixar').onclick = () => exportar(false);
$('compartilhar').onclick = () => exportar(true);

$('formRefeicao').onsubmit = e => {
  e.preventDefault();
  gravar(dados.refeicoes, { tipo: e.target.tipo.value, hora: $('rHora').value, texto: $('rTexto').value.trim() }, $('dlgRefeicao'));
};

$('formTreino').onsubmit = e => {
  e.preventDefault();
  gravar(dados.treinos, {
    titulo: $('tTitulo').value.trim(),
    kcal: Number($('tKcal').value),
    min: Number($('tHoras').value) * 60 + Number($('tMinutos').value)
  }, $('dlgTreino'));
};

render();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
}
if (navigator.storage && navigator.storage.persist) {
  navigator.storage.persist();
}
</script>
</body>
</html>
